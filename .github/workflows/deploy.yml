name: Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling so a
# published site is always the result of a completed run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pdf.js 4.10 calls `Promise.withResolvers`, which Node gained in 22.
      # The browser bundle is unaffected, but the unit suites now open real
      # documents with pdf.js under jsdom, so the runner needs it too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Chromium only. It is the browser whose build the project has verified,
      # and the end-to-end suite exists for the one thing jsdom cannot do:
      # rasterise a page on a real canvas. Firefox and WebKit are outstanding.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run build

      - name: Upload production bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Only the default branch publishes; pull requests stop after verify.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
