<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Repository-relative so the icon resolves under a GitHub Pages
         project path such as /pdf-toolkit/, not just at a domain root. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Toolkit — Fast, Private, In-Browser PDF Tools</title>
    <meta
      name="description"
      content="Merge, delete, reorder, split, and convert PDF files directly in your browser. 100% privacy-first with zero server uploads."
    />
    <!-- No webfont link, by design. Typography uses system fonts only
         (see src/styles/theme.css), so no font file is redistributed and no
         font licence applies. Nothing here may point at a third-party host:
         the deployed site must make no external request at all, so that
         "processed entirely in your browser" is verifiable in the network
         panel rather than merely asserted. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
